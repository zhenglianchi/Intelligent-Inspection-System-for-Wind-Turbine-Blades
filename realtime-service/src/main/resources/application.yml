server:
  port: 8083
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 100
    max-connections: 10000

spring:
  application:
    name: realtime-service
  main:
    allow-bean-definition-overriding: true
  config:
    import:
      - optional:nacos:realtime-service.yaml
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wind_farm_db?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 3000
  cloud:
    nacos:
      discovery:
        enabled: true
        register-enabled: true
        heartbeat-interval: 5000
        heartbeat-timeout: 15000
      config:
        refresh-enabled: true
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml

mqtt:
  enabled: true
  host: tcp://localhost:1883
  client-id: wind-power-realtime-${random.uuid}
  username: guest
  password: guest
  connection-timeout: 30
  keepalive: 20
  topic: $share/wind-power-group/windpower/monitoring

realtime:
  feacurve:
    capacity: 20

mybatis:
  configuration:
    map-underscore-to-camel-case: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: wind-power-health-monitor-secret-key-2025-wind-power-microservice-long-key!!
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: realtime-service

