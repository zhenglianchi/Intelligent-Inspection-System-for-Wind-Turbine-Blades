# API Gateway 配置
server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import:
      - optional:nacos:api-gateway.yaml
  cloud:
    nacos:
      discovery:
        enabled: true
        register-enabled: true
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        heartbeat-interval: 5000
        heartbeat-timeout: 15000
      config:
        refresh-enabled: true
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml
    gateway:
      routes:
        - id: agent-service-api
          uri: lb://agent-service
          predicates:
            - Path=/api/**
        - id: realtime-service-realtime
          uri: lb://realtime-service
          predicates:
            - Path=/realtime/**
        - id: realtime-service-windturbine
          uri: lb://realtime-service
          predicates:
            - Path=/windturbine/**
        - id: realtime-service-search
          uri: lb://realtime-service
          predicates:
            - Path=/searchMaxWindturbineId/**
        - id: realtime-service-windfarms
          uri: lb://realtime-service
          predicates:
            - Path=/windfarms/**
        - id: auth-service-user
          uri: lb://auth-service
          predicates:
            - Path=/user/**
      httpclient:
        response-timeout: 300s
        connect-timeout: 10000
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true

# Actuator 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: api-gateway

# 日志级别
logging:
  level:
    org.springframework.cloud.gateway: info
    com.itheima.gateway: debug

