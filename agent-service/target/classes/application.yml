server:
  port: 8084

spring:
  application:
    name: agent-service
  config:
    import:
      - optional:nacos:agent-service.yaml
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
  cloud:
    nacos:
      discovery:
        enabled: true
        register-enabled: true
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        heartbeat-interval: 5000
        heartbeat-timeout: 15000
      config:
        refresh-enabled: true
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 10000
          realtime-service:
            connect-timeout: 3000
            read-timeout: 15000

langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: sk-
      model-name: qwen-plus
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: sk-
      model-name: qwen-plus
      log-requests: true
      log-responses: true
    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: sk-
      model-name: text-embedding-v3
      log-requests: true
      log-responses: true
      max-segments-per-batch: 10
    rerank-model:
      base-url: https://dashscope.aliyuncs.com/api/v1/services/rerank
      api-key: sk-
      model-name: gte-rerank-v2
      log-requests: true
      log-responses: true
  community:
    redis:
      host: localhost
      port: 6379
    embedding-store:
      index-name: wind-farm-knowledge
      dimension: 1536
      use-filter: true

aliyun:
  docmind:
    enabled: true
    access-key-id: LTA
    access-key-secret: n5b
    timeout-seconds: 300
    poll-interval-seconds: 5

mybatis:
  configuration:
    map-underscore-to-camel-case: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: wind-power-health-monitor-secret-key-2025-wind-power-microservice-long-key!!
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: agent-service

rag:
  pdf-path: D:/Awork/RAG/wind-power-microservice/agent-service/src/main/resources/content
  auto-init: false
  index-name: embedding-index
  chunk-size: 800
  chunk-overlap: 200
  splitter:
    strategy: ALIYUN_SMART
    title:
      max-section-size: 2000
      enable-sub-split: true
  retrieval:
    top-k-recall: 20
    min-score: 0.6
    keyword-top-k: 20
    keyword-min-score: 0.1
    rrf-k: 15
    top-k-final: 5
    rerank-threshold: 0.3
    keyword:
      fuzzy-enabled: true
  memory:
    short-term:
      window-size: 10
      window-ttl-days: 1
    inject-long-term: true
    archive-ttl-days: 30
    retrieval:
      enabled: true
      max-rounds: 5
      min-score: 0.1
      expand-context: true
      expand-radius: 2
  rerank:
    api-path: "/text-rerank/text-rerank"
  turbine:
    default-limit: 50
    fault-limit: 100
  degradation:
    level: NORMAL
    rag-enabled: true
    tool-enabled: true
    fallback-message: "System is in degradation mode, please try again later."
  query-rewrite:
    enabled: true
    expand-queries: true
  hyde:
    enabled: true
    hypothetical-count: 1
    search-top-k: 5
    min-score: 0.5
  enhanced:
    enabled: true
    use-query-rewrite: true
    use-hyde: true
    merge-strategy: UNION

